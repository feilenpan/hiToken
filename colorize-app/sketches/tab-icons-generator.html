<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tab Bar Icons Generator</title>
</head>
<body>
  <h2>Tab Bar 圖標生成器</h2>
  
  <!-- AI上色 - 調色盤圖標 -->
  <div>
    <h3>1. AI上色（未選中 - 灰色）</h3>
    <svg width="81" height="81" viewBox="0 0 81 81" xmlns="http://www.w3.org/2000/svg" id="colorize">
      <circle cx="40.5" cy="40.5" r="38" fill="none" stroke="#999" stroke-width="3"/>
      <!-- 調色盤 -->
      <circle cx="20" cy="25" r="6" fill="#999"/>
      <circle cx="35" cy="18" r="6" fill="#999"/>
      <circle cx="50" cy="18" r="6" fill="#999"/>
      <circle cx="62" cy="28" r="6" fill="#999"/>
      <circle cx="65" cy="45" r="6" fill="#999"/>
      <circle cx="58" cy="58" r="6" fill="#999"/>
      <!-- 中心孔 -->
      <circle cx="40.5" cy="40.5" r="8" fill="none" stroke="#999" stroke-width="3"/>
      <!-- 畫筆 -->
      <path d="M 35 50 L 30 60 L 25 65 L 22 62 L 27 57 L 37 52 Z" fill="#999"/>
    </svg>
    
    <h3>AI上色（選中 - 橙色）</h3>
    <svg width="81" height="81" viewBox="0 0 81 81" xmlns="http://www.w3.org/2000/svg" id="colorize-active">
      <circle cx="40.5" cy="40.5" r="38" fill="none" stroke="#FF6B35" stroke-width="3"/>
      <!-- 調色盤 -->
      <circle cx="20" cy="25" r="6" fill="#FF6B35"/>
      <circle cx="35" cy="18" r="6" fill="#FF8F60"/>
      <circle cx="50" cy="18" r="6" fill="#FF6B35"/>
      <circle cx="62" cy="28" r="6" fill="#FF8F60"/>
      <circle cx="65" cy="45" r="6" fill="#FF6B35"/>
      <circle cx="58" cy="58" r="6" fill="#FF8F60"/>
      <!-- 中心孔 -->
      <circle cx="40.5" cy="40.5" r="8" fill="none" stroke="#FF6B35" stroke-width="3"/>
      <!-- 畫筆 -->
      <path d="M 35 50 L 30 60 L 25 65 L 22 62 L 27 57 L 37 52 Z" fill="#FF6B35"/>
    </svg>
  </div>

  <!-- 照片修復 - 扳手圖標 -->
  <div>
    <h3>2. 照片修復（未選中 - 灰色）</h3>
    <svg width="81" height="81" viewBox="0 0 81 81" xmlns="http://www.w3.org/2000/svg" id="enhance">
      <!-- 圖片框架 -->
      <rect x="15" y="20" width="50" height="40" rx="4" fill="none" stroke="#999" stroke-width="3"/>
      <!-- 山形圖案 -->
      <polyline points="15,50 25,35 35,45 50,25 65,45" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- 太陽 -->
      <circle cx="50" cy="32" r="4" fill="#999"/>
      <!-- 扳手 -->
      <g transform="translate(45, 45) rotate(-45)">
        <rect x="0" y="0" width="20" height="8" rx="2" fill="#999"/>
        <rect x="18" y="-2" width="8" height="12" rx="2" fill="#999"/>
      </g>
    </svg>
    
    <h3>照片修復（選中 - 綠色）</h3>
    <svg width="81" height="81" viewBox="0 0 81 81" xmlns="http://www.w3.org/2000/svg" id="enhance-active">
      <!-- 圖片框架 -->
      <rect x="15" y="20" width="50" height="40" rx="4" fill="none" stroke="#4CAF50" stroke-width="3"/>
      <!-- 山形圖案 -->
      <polyline points="15,50 25,35 35,45 50,25 65,45" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- 太陽 -->
      <circle cx="50" cy="32" r="4" fill="#4CAF50"/>
      <!-- 扳手 -->
      <g transform="translate(45, 45) rotate(-45)">
        <rect x="0" y="0" width="20" height="8" rx="2" fill="#4CAF50"/>
        <rect x="18" y="-2" width="8" height="12" rx="2" fill="#4CAF50"/>
      </g>
    </svg>
  </div>

  <!-- 我的 - 用戶圖標 -->
  <div>
    <h3>3. 我的（未選中 - 灰色）</h3>
    <svg width="81" height="81" viewBox="0 0 81 81" xmlns="http://www.w3.org/2000/svg" id="profile">
      <!-- 頭部 -->
      <circle cx="40.5" cy="28" r="12" fill="none" stroke="#999" stroke-width="3"/>
      <!-- 身體 -->
      <path d="M 20 65 Q 20 48 40.5 48 Q 61 48 61 65" fill="none" stroke="#999" stroke-width="3" stroke-linecap="round"/>
    </svg>
    
    <h3>我的（選中 - 橙色）</h3>
    <svg width="81" height="81" viewBox="0 0 81 81" xmlns="http://www.w3.org/2000/svg" id="profile-active">
      <!-- 頭部 -->
      <circle cx="40.5" cy="28" r="12" fill="#FF6B35"/>
      <!-- 身體 -->
      <path d="M 20 65 Q 20 48 40.5 48 Q 61 48 61 65" fill="none" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <script>
    // 下載 SVG 為 PNG
    function downloadSVGAsPNG(svgId, filename) {
      const svg = document.getElementById(svgId);
      const canvas = document.createElement('canvas');
      canvas.width = 81 * 3; // 3x 解析度
      canvas.height = 81 * 3;
      const ctx = canvas.getContext('2d');
      
      const data = new XMLSerializer().serializeToString(svg);
      const img = new Image();
      const blob = new Blob([data], {type: 'image/svg+xml'});
      const url = URL.createObjectURL(blob);
      
      img.onload = function() {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function(blob) {
          const link = document.createElement('a');
          link.download = filename;
          link.href = URL.createObjectURL(blob);
          link.click();
          URL.revokeObjectURL(url);
        });
      };
      img.src = url;
    }

    // 添加下載按鈕
    const svgs = [
      {id: 'colorize', name: 'tab-colorize.png'},
      {id: 'colorize-active', name: 'tab-colorize-active.png'},
      {id: 'enhance', name: 'tab-enhance.png'},
      {id: 'enhance-active', name: 'tab-enhance-active.png'},
      {id: 'profile', name: 'tab-profile.png'},
      {id: 'profile-active', name: 'tab-profile-active.png'}
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.body;
      const btnContainer = document.createElement('div');
      btnContainer.style.cssText = 'position: fixed; top: 20px; right: 20px; background: white; padding: 20px; border: 2px solid #333; border-radius: 8px;';
      
      const title = document.createElement('h3');
      title.textContent = '下載圖標';
      btnContainer.appendChild(title);
      
      svgs.forEach(svg => {
        const btn = document.createElement('button');
        btn.textContent = `下載 ${svg.name}`;
        btn.style.cssText = 'display: block; margin: 8px 0; padding: 8px 16px; cursor: pointer;';
        btn.onclick = () => downloadSVGAsPNG(svg.id, svg.name);
        btnContainer.appendChild(btn);
      });
      
      const downloadAll = document.createElement('button');
      downloadAll.textContent = '下載全部';
      downloadAll.style.cssText = 'display: block; margin-top: 16px; padding: 12px 24px; background: #FF6B35; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;';
      downloadAll.onclick = () => {
        svgs.forEach((svg, index) => {
          setTimeout(() => downloadSVGAsPNG(svg.id, svg.name), index * 500);
        });
      };
      btnContainer.appendChild(downloadAll);
      
      container.appendChild(btnContainer);
    });
  </script>

  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px 200px 20px 20px;
      background: #f5f5f5;
    }
    h2 { color: #333; }
    h3 { 
      color: #666; 
      margin-top: 24px;
      margin-bottom: 8px;
    }
    svg { 
      background: white; 
      border: 1px solid #ddd; 
      margin: 8px 0;
      border-radius: 8px;
    }
    div { margin-bottom: 32px; }
  </style>
</body>
</html>
